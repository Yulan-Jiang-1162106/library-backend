server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library?useUnicode=true&characterEncoding=utf-8
    username: root
    password: 123456
#    數據庫嘅版本最好8.0以上
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
#  映射路徑mapper文件夾下邊所有xml嘅文件
  mapper-locations: classpath:mapper/*.xml
#  佢所對應嘅數據類型或者話實體類
  type-aliases-package: com.yx.domain
  configuration:
    map-underscore-to-camel-case: true
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
logging:
  level:
    com.yx.mapper: debug